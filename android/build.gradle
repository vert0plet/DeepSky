// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

subprojects { module ->
    module.plugins.withId('kotlin-android') { kotlinPlugin ->
        // Use the patched compiler and produce metadata the Android lint tools can read.
        def versionType = kotlinPlugin.class.classLoader.loadClass('org.jetbrains.kotlin.gradle.dsl.KotlinVersion')
        module.kotlin.compilerOptions.languageVersion.set(versionType.valueOf('KOTLIN_2_2'))
        module.dependencies.add('implementation', 'org.jetbrains.kotlin:kotlin-stdlib:2.2.21')
    }
}
