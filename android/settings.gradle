// Keep the host-side Android build tools on patched, compatible releases.
// This applies to the app and to the Capacitor subprojects' build classpaths.
gradle.beforeProject { project ->
    project.buildscript.configurations.named('classpath') {
        resolutionStrategy.eachDependency { dep ->
            def module = dep.requested
            def versions = [
                'com.android.tools.build:gradle': '8.13.2',
                'com.google.guava:guava': '33.7.2-jre',
                'org.apache.commons:commons-compress': '1.28.0',
                'org.bitbucket.b_c:jose4j': '0.9.7',
                'org.jdom:jdom2': '2.0.6.1'
            ]
            def version = versions[module.group + ':' + module.name]
            if (module.group == 'io.netty' && module.version?.startsWith('4.1.')) version = '4.1.141.Final'
            if (module.group == 'org.bouncycastle' && module.name.endsWith('-jdk18on')) version = '1.87'
            if (version != null) dep.useVersion(version)
        }
    }
}

include ':app'
include ':capacitor-cordova-android-plugins'
project(':capacitor-cordova-android-plugins').projectDir = new File('./capacitor-cordova-android-plugins/')

apply from: 'capacitor.settings.gradle'